# recorrido: misiones
# Misiones de onboarding. Alcance del TP: 6 a 8.
# TODO(experiencia + pm): completar hasta 6-8 y ajustar puntos.
#
# approver: manager | helpdesk | agent
# Criterio: se dan puntos por aprender y por recorrer la organización, nunca por
# rendimiento. Cada misión tiene que poder verificarse con evidencia concreta.

- key: casilla-de-mail
  title: Conseguí tu casilla de mail
  description: Llamá al interno 100 de Mesa de Ayuda y pedí el alta de tu casilla.
  points: 20
  approver: helpdesk
  evidence_required: Captura del primer mail enviado desde tu casilla.

- key: almuerzo-logistica
  title: Almorzá con alguien de Logística
  description: Coordiná un almuerzo con el referente de Logística y preguntale cómo llega un pedido a destino.
  points: 40
  approver: manager
  evidence_required: Con quién almorzaste y una cosa que aprendiste.

- key: primer-pedido-de-compra
  title: Hacé tu primer pedido de compra
  description: Seguí el proceso de compras de punta a punta con algo que necesites de verdad.
  points: 30
  approver: agent
  evidence_required: Número de pedido generado.

- key: cuidado-de-la-informacion
  title: Aprendé a cuidar la información
  description: Leé la guía interna de seguridad y averiguá cómo reportar un mensaje sospechoso.
  points: 50
  approver: agent
  evidence_required: Mencioná dos prácticas de cuidado y el canal para reportar un mensaje sospechoso.

- key: reunion-con-tu-lider
  title: Tené tu reunión de bienvenida
  description: Participá de la reunión de bienvenida con tu supervisor directo para conversar sobre el alcance del rol y las primeras tareas.
  points: 20
  approver: manager
  evidence_required: Contá con quién fue la reunión y nombrá una prioridad o tarea acordada.

- key: conoce-sigma-wms
  title: Conocé Sigma WMS
  description: Recorré con una persona referente el flujo básico del sistema y ubicá dónde consultar el manual completo.
  points: 30
  approver: helpdesk
  evidence_required: Mencioná una operación aprendida y dónde encontraste el manual.
