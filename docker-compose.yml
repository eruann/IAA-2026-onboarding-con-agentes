name: onboarding

x-app: &app
  build:
    context: .
    target: dev
  image: onboarding-dev
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://onboarding:onboarding@db:5432/onboarding
    # En Windows los cambios en volúmenes montados no siempre disparan eventos:
    # sin esto el hot reload no funciona.
    WATCHFILES_FORCE_POLLING: "true"
    # El contenedor corre como root: sin esto deja __pycache__ de root adentro de
    # ./src y en Linux después no se pueden borrar sin sudo.
    PYTHONDONTWRITEBYTECODE: "1"
  volumes:
    - ./src:/app/src # incluye los *_test.py, que no están en la imagen
    - ./corpus:/app/corpus
    - ./data:/app/data
    - ./eval:/app/eval
    - ./alembic.ini:/app/alembic.ini:ro
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: onboarding
      POSTGRES_PASSWORD: onboarding
      POSTGRES_DB: onboarding
    ports:
      - "5433:5432" # 5433 en el host para no chocar con un Postgres local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onboarding -d onboarding"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    command: alembic upgrade head
    restart: "no"

  # API + panel del jefe + endpoint de Slack, todo en el mismo proceso
  app:
    <<: *app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # URL pública para que Slack pueda mandar eventos al entorno local.
  # Solo la necesita quien trabaja en el bot: docker compose --profile tunnel up
  # La URL aparece en los logs de este contenedor y se pega en la app de Slack.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    command: tunnel --no-autoupdate --url http://app:8000
    depends_on:
      - app

  # Modelo abierto local para comparar costo y calidad contra OpenRouter:
  # docker compose --profile local-llm up ollama
  ollama:
    image: ollama/ollama:latest
    profiles: [local-llm]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
