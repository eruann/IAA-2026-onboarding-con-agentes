# Benchmark de captura de conocimiento informal (agente extract_knowledge).
# Set fijo: se define ANTES de correr el experimento (ver eval/README.md, regla 1).
#
# Cada caso es una conversación y lo que `extract_triples` tiene que devolver
# según las reglas de agents/extract_knowledge/extraction_prompt.md, contra el
# organigrama y los procedimientos de corpus/. Los casos `must_not` miden lo que
# NO tiene que capturar (precisión); los `expected`, lo que sí (recall).
#
# Campos de cada caso:
#   id            único, prefijo = regla que prueba
#   rule          la regla del prompt que se está probando (lista abajo)
#   conversation  el texto que recibe el agente
#   expected      relaciones esperadas (lista vacía: no hay nada que extraer)
#     subject               nombre completo, tal como aparece en la frase
#     relation              una de knows_about | introduced | belongs_to | owns_process
#                           | works_with, o una lista de alternativas válidas
#     object_keywords       alguna tiene que aparecer en el objeto (comparar en
#                           minúsculas y sin tildes). En `introduced` y
#                           `works_with`, el nombre de la otra persona
#     evidence              frase textual de respaldo: tiene que estar letra por
#                           letra en `conversation`, con sus errores de tipeo
#     criticality           high | medium | low. En los casos de borde, el más alto
#                           de los dos (regla del prompt: ante la duda, el más
#                           alto); llevan el comentario "dudoso". null: no se
#                           mide (p. ej. belongs_to)
#     negated, exclusive    si se omiten, se espera false
#     inferred              true si es una herramienta deducida (va en `inferred`
#                           de la salida, siempre low); si se omite, se espera false
#     subject_position,
#     subject_organization  si se omiten, se espera vacío; si están, cómo lo dice
#                           el texto (comparar sin tildes ni mayúsculas)
#   must_not      lo que no se tiene que devolver, con el motivo (opcional)
#     object_keywords_forbidden  palabras que no pueden aparecer en ningún objeto
#   agent         solo para medir el agente completo (node.py), no la extracción:
#     needs_review   true si no se sabe de qué organización es la persona
#     off_role       true si la tarea choca con el puesto oficial (role_fit_prompt.md)
#     not_same_as    id del organigrama con el que NO se tiene que unificar
#     same_as        id con el que SÍ se tiene que unificar (p. ej. solo el apellido)
#   redundancy    solo en los casos de un grupo de redundancia: {group, kind}
#     kind  original    primera mención del dato
#           paraphrase  el mismo dato con otras palabras
#           verbatim    la frase del original idéntica, en otra conversación
#           distinct    control: se parece pero es otro dato; no se unifica
#
# Al final, `redundancy_groups`: qué casos forman cada grupo y cuántas relaciones
# tiene que dejar el dato en el grafo (siempre 1).
#
# Reglas (rule):
#   referral          "preguntale a X", "X sabe de": knows_about
#   introduced        presentación entre gente de la empresa
#   works_with        trabajan juntos o se conocen por trabajo (no lo social, ni
#                     lo que dice el organigrama, ni una presentación)
#   inferred          la herramienta de algo que alguien hizo, solo si la
#                     conversación o un procedimiento dice con qué se hace; nunca
#                     temas de negocio
#   office_task       tareas de apoyo de oficina: se devuelven y son low
#   social_excluded   lo puramente social o personal no se devuelve
#   social_with_work  contexto social que trae organización o tema de trabajo
#   pronoun           "lo vea con él": knows_about del nombrado antes
#   typo_evidence     la frase se copia con sus errores de tipeo
#   opinion           las opiniones sobre personas se descartan
#   org_chart_dup     lo que ya dice el organigrama no se devuelve
#   documented        lo que ya dice un procedimiento no se devuelve
#   role_derived      lo que se deduce del puesto no se devuelve
#   beyond_role       conocimiento práctico no escrito, aunque sea de su área
#   criticality       niveles high / medium / low según bienvenida.md y reglas
#   negation          "no se encarga", "dejó de ser", "antes X, ahora Y"
#   exclusive         "solo", "el único", "nadie más que" (y lo que no lo es)
#   object_verbatim   no corregir nombres de empresas o bancos
#   full_name         el sujeto con todos sus apellidos
#   external_profile  puesto y organización de gente de afuera
#   off_role          tarea que choca con el puesto oficial (nivel agente)
#   identity          homónimos externos de internos y nombres parecidos (tipeo,
#                     apodo, apellido de más, una letra de diferencia). Nivel
#                     agente (identity.py): `same_as` / `not_same_as`. Un "puede
#                     ser" (pendiente de validar) cuenta como no unificado
#   empty             no hay nada que extraer
#   mixed             conversación larga con casos que sí y que no
#   redundancy        el mismo dato informal repetido (paráfrasis y textual)
#
# Métricas sugeridas: precisión y recall de relaciones (match = subject +
# relation + alguna object_keyword), exactitud de evidence (substring exacto),
# acierto de criticidad, negated y exclusive sobre las relaciones que matchean,
# y tasa de falsos positivos en los casos `empty` y `must_not`.
# Redundancia, por grupo: tasa de duplicación = (relaciones del dato − 1) /
# menciones repetidas, separada en paráfrasis y textual; y uniones de más =
# casos `distinct` que quedaron unidos al dato.

cases:

  # ---------------------------------------------------------------- referral
  - id: referral-001
    rule: referral
    conversation: |
      Para armar tablas dinámicas en Excel, preguntale a Ana Ruiz.
    expected:
      - subject: Ana Ruiz
        relation: knows_about
        object_keywords: [tablas dinamicas, excel]
        evidence: "Para armar tablas dinámicas en Excel, preguntale a Ana Ruiz."
        criticality: low

