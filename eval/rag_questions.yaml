# Set fijo de 15-20 preguntas típicas de un ingresante, con respuesta conocida
# en el corpus. Se define ANTES de correr el experimento.
#
# expected_document / expected_section: dónde está la respuesta. Es lo que se usa
# para medir recall del retrieval, independiente de lo que el modelo conteste.

# recorrido: preguntas-eval
- id: compras-001
  question: ¿Cómo pido una compra?
  expected_document: compras.md
  expected_section: Pedido de compra
  expected_answer_contains: formulario interno

- id: mail-001
  question: ¿Cómo consigo mi casilla de mail?
  expected_document: mesa-de-ayuda.md
  expected_section: Alta de casilla de mail
  expected_answer_contains: interno 100

- id: organigrama-001
  question: ¿Quién es el Jefe de Compras?
  expected_document: organigrama.md
  expected_section: Compras
  expected_answer_contains: Diego Fernández

- id: logistica-001
  question: ¿A qué hora sale el despacho si no llego a cargar el pedido antes de las 9?
  expected_document: logistica.md
  expected_section: Despacho a destino
  expected_answer_contains: al día siguiente

- id: vacaciones-001
  question: ¿Con cuánta anticipación tengo que pedir vacaciones?
  expected_document: vacaciones-y-licencias.md
  expected_section: Pedido de vacaciones
  expected_answer_contains: 15 días

- id: horarios-001
  question: Si me olvido la tarjeta magnética, ¿cómo registro mi asistencia?
  expected_document: horarios-y-asistencia.md
  expected_section: Registro de asistencia
  expected_answer_contains: interno 100

- id: seguridad-001
  question: ¿Cada cuánto tengo que cambiar mi contraseña?
  expected_document: seguridad-informatica.md
  expected_section: Contraseñas
  expected_answer_contains: 90 días

- id: viaticos-001
  question: ¿En cuántos días tengo que rendir los gastos cuando vuelvo de un viaje?
  expected_document: viaticos-y-gastos.md
  expected_section: Rendición de gastos
  expected_answer_contains: 5 días

- id: conducta-001
  question: ¿A quién le reporto si tengo un conflicto de interés con un proveedor?
  expected_document: codigo-de-conducta.md
  expected_section: Conflictos de interés
  expected_answer_contains: Romina Castro

- id: reuniones-001
  question: ¿Qué pasa el primer día que entro a la empresa?
  expected_document: reuniones-y-comunicacion.md
  expected_section: Reunión de ingreso
  expected_answer_contains: reunión de bienvenida

- id: proveedores-001
  question: ¿A cuántos días se le paga a un proveedor?
  expected_document: proveedores.md
  expected_section: Pago a proveedores
  expected_answer_contains: 30 días

- id: teletrabajo-001
  question: ¿Cuántos días de teletrabajo tengo si trabajo en Compras?
  expected_document: teletrabajo.md
  expected_section: Días de teletrabajo
  expected_answer_contains: 2 días

- id: capacitacion-001
  question: ¿Quién da la capacitación de ingreso?
  expected_document: capacitacion.md
  expected_section: Capacitación de ingreso
  expected_answer_contains: Mesa de Ayuda

- id: incidentes-001
  question: ¿A quién reporto un reclamo de un cliente por demora en un pedido?
  expected_document: incidentes-y-reclamos.md
  expected_section: Reclamo de un cliente
  expected_answer_contains: Pablo Sosa

- id: rrhh-001
  question: ¿Desde cuándo puedo descargar mi recibo de sueldo?
  expected_document: rrhh-politicas.md
  expected_section: Recibo de sueldo
  expected_answer_contains: día 1 de cada mes

- id: faq-001
  question: ¿Puedo cambiar de área dentro de la empresa?
  expected_document: faq-general.md
  expected_section: ¿Puedo cambiar de área?
  expected_answer_contains: Romina Castro

# recorrido: preguntas-sin-respuesta
