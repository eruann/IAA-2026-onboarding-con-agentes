# Set fijo de 15-20 preguntas típicas de un ingresante, con respuesta conocida
# en el corpus. Se define ANTES de correr el experimento.
#
# expected_document / expected_section: dónde está la respuesta. Es lo que se usa
# para medir recall del retrieval, independiente de lo que el modelo conteste.
# expected_document puede ser una lista cuando más de un documento del corpus
# responde correctamente la misma pregunta (no es error del retriever si trae
# cualquiera de los dos) — en ese caso expected_section queda en null, porque
# no hay una única sección correcta a la que apuntar.
#
# expected_answer_contains puede ser un string o una lista de alternativas
# válidas (cualquiera que matchee cuenta como correcto) — para no exigirle al
# modelo la frase exacta del corpus cuando hay varias formas correctas de
# decir lo mismo (números en letras, nombre de una persona vs. del equipo que
# integra, etc).
#
# LIMITACIÓN CONOCIDA: expected_section no se puede medir todavía para ninguna
# pregunta — chunk_text corta por tamaño (1200 caracteres), no por encabezado
# `##`, y ningún documento del corpus llega a ese límite, así que cada uno
# queda como un solo fragmento sin distinción de sección. Se arregla en un
# PR aparte, mejorando el chunker para que corte respetando encabezados.

# recorrido: preguntas-eval
