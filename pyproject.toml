[project]
name = "onboarding"
version = "0.1.0"
description = "Onboarding gamificado con agentes de IA"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # API, panel web y Slack (un solo proceso)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "slack-bolt>=1.20",
    "pydantic-settings>=2.4",
    # Base de datos: Postgres + pgvector
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.13",
    # Agentes y modelos. El proveedor es OpenRouter vía API compatible con OpenAI:
    # no hay dependencia de un vendor de LLM en concreto.
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onboarding"]
# Los tests viven al lado del código pero no forman parte del paquete
exclude = ["**/*_test.py", "**/conftest.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
# Tests al lado del código: chunking.py + chunking_test.py.
# Una sola convención: pytest solo reconoce *_test.py.
testpaths = ["src"]
python_files = ["*_test.py"]
addopts = "-q"
markers = [
    "db: necesita Postgres (lo levanta docker compose y CI)",
    "llm: llama a un modelo real y gasta plata; nunca corre en CI",
]

[tool.coverage.run]
# La cobertura mide el código, no los tests
omit = ["*_test.py", "*/conftest.py"]
