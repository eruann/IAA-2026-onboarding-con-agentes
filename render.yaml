# Infraestructura de la demo, versionada. Nada se configura a mano en la web.
# La base es un proyecto de Neon (Postgres con pgvector, persistente): su URL
# se carga como secreto en Render, no acá.
#
# Pasos para crear todo esto: docs/runbooks/deploy.md

services:
  - type: web
    name: onboarding
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Misma región que el proyecto de Neon: si cambiás una, cambiá la otra.
    region: oregon
    branch: main
    # Deploy solo si los checks de CI pasan (lint, tests, migraciones, build)
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    # Las migraciones corren al arrancar, no como pre-deploy: preDeployCommand
    # existe solo en los planes pagos. Si una migración falla, el contenedor no
    # levanta y Render mantiene la versión anterior.
    # El plan free corre una sola instancia, así que no hay dos procesos
    # migrando a la vez. Si algún día se escala, esto pasa a preDeployCommand.
    dockerCommand: sh -c "alembic upgrade head && uvicorn onboarding.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENV
        value: prod
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_MODEL
        value: anthropic/claude-haiku-4.5
      # sync: false = se carga a mano en el panel de Render y nunca toca el repo
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
