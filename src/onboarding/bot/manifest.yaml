# Manifiesto de la app de Slack.
#
# Cada dev que trabaje en el bot crea SU PROPIA app de prueba:
#   1. https://api.slack.com/apps -> Create New App -> From an app manifest
#   2. Pegar este archivo, reemplazando tu-nombre por el tuyo y TU-URL-PUBLICA
#      por la URL del túnel, y borrando el bloque event_subscriptions
#   3. Seguir los pasos de docs/setup.md, sección Slack
#
# Para la app de producción (Render), ver docs/runbooks/deploy.md.
#
# Con túnel gratuito la URL cambia cada vez que se reinicia: hay que
# actualizarla en la app de Slack.

display_information:
  name: local-onboarding-tu-nombre
  description: Misiones de onboarding y respuestas sobre la empresa
  background_color: "#2b303b"

features:
  # Habilita los mensajes directos (DM) al bot. Sin esto Slack le muestra al
  # usuario "Sending messages to this app has been turned off".
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: local-onboarding-tu-nombre
    always_online: false
  slash_commands:
    - command: /misiones
      url: https://TU-URL-PUBLICA/slack/events
      description: Ver tus misiones de onboarding
      should_escape: false

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - commands
      - im:history
      - im:read
      - im:write
      - users:read

settings:
  event_subscriptions:
    request_url: https://TU-URL-PUBLICA/slack/events
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
    request_url: https://TU-URL-PUBLICA/slack/events
  socket_mode_enabled: false
  org_deploy_enabled: false
  token_rotation_enabled: false
